<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="omBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#FF6600"/>
    </linearGradient>
    <filter id="omShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15"/>
    </filter>
  </defs>
  
  <!-- Orange Squircle Background -->
  <rect width="64" height="64" rx="14" fill="url(#omBg)"/>
  
  <!-- Subtle internal border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Content: OM Monogram with Orange brand badge -->
