<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="bgPromo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="40%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#431407"/>
    </linearGradient>
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glowPromo" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowBoxPromo" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fond Dégradé Chaleureux 16:9 -->
  <rect width="1600" height="900" fill="url(#bgPromo)"/>
  <rect width="1600" height="900" fill="url(#glowPromo)"/>

  <!-- Cercles décoratifs -->
  <circle cx="1380" cy="220" r="260" fill="#f59e0b" opacity="0.12"/>
  <circle cx="150" cy="750" r="200" fill="#ea580c" opacity="0.15"/>

  <!-- Badge Promo Flash -->
  <g transform="translate(100, 140)">
    <rect width="360" height="46" rx="23" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    <circle cx="28" cy="23" r="10" fill="#ef4444"/>
    <text x="50" y="29" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#ffffff" letter-spacing="2">
      🔥 BONS PLANS DU CAMPUS
    </text>
  </g>

  <!-- Titre Principal -->
  <text x="100" y="270" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
    PROMOS &amp; EXAMENS
  </text>
  
  <text x="100" y="340" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="url(#fireGrad)">
    Les Meilleurs Tarifs Négociés pour les Étudiants
  </text>

  <text x="100" y="420" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#fed7aa">
    Repas chauds, thieboudienne, fatayas croustillants, café Touba,
  </text>
  <text x="100" y="460" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff">
    Polycopies de révision et clés USB directement à votre chambre !
  </text>

  <!-- 3 Cartouches Catégories Promo -->
  <g transform="translate(100, 540)">
    <rect x="0" y="0" width="260" height="72" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="24" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#fef08a">🍲 RESTAURATION</text>
    <text x="24" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#ffffff">Plats chauds &amp; goûters</text>

    <rect x="280" y="0" width="280" height="72" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="304" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#fed7aa">📚 FOURNITURES</text>
    <text x="304" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#ffffff">Fascicules &amp; polycopies</text>

    <rect x="580" y="0" width="260" height="72" rx="20" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
    <text x="604" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#86efac">🔌 HIGH-TECH</text>
    <text x="604" y="56" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="600" fill="#ffffff">Chargeurs &amp; écouteurs</text>
  </g>

  <!-- Visuel Graphique à Droite -->
  <g transform="translate(1040, 160)" filter="url(#shadowBoxPromo)">
    <rect x="0" y="40" width="440" height="520" rx="36" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.3" stroke-width="2"/>
    
    <circle cx="220" cy="200" r="110" fill="#ea580c"/>
    <circle cx="220" cy="200" r="95" fill="#f97316"/>
    
    <!-- Flamme Promo stylisée -->
    <path d="M 220 125 C 245 160, 275 190, 275 230 C 275 270, 245 295, 220 295 C 195 295, 165 270, 165 230 C 165 195, 195 160, 220 125 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 220 180 C 235 205, 250 225, 250 248 C 250 272, 235 285, 220 285 C 205 285, 190 272, 190 248 C 190 225, 205 205, 220 180 Z" fill="#f59e0b"/>

    <text x="220" y="370" font-family="'Plus Jakarta Sans', sans-serif" font-size="30" font-weight="900" fill="#ffffff" text-anchor="middle">
      PRIX ÉTUDIANTS
    </text>
    <text x="220" y="415" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="600" fill="#fed7aa" text-anchor="middle">
      Commandez vite avant rupture !
    </text>

    <!-- Pastille Discount -->
    <g transform="translate(70, 460)">
      <rect width="300" height="54" rx="27" fill="#dc2626"/>
      <text x="150" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">
        🔥 OFFRES DU JOUR DISPOS
      </text>
    </g>
  </g>
</svg>
