name: Déploiement Vercel Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configuration de l'environnement Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances du projet
        run: npm ci

      - name: Exécuter les tests de non-régression
        run: npm test

      - name: Installer Vercel CLI
        run: npm install --global vercel@latest

      - name: Récupérer la configuration et variables d'environnement Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Compiler le projet en mode production (Prebuilt)
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Déployer les artefacts pré-compilés sur Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
